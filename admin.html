    <link href="https://cdn.lineicons.com/5.0/lineicons.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet">
    <title>Acceso doctores</title>
</head>
<header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html" style="font-size: 24px;align-items: center;display: flex;" title="Volver a la pagina principal">

                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav"> 
                        <li>

    </header>
<body>
    <h1 style="text-align: center;">Citas agendadas</h1>
    <div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <button class="btn btn-light btn-sm" id="prevMonth">❮</button>
            <h4 class="mb-0" id="monthYear"></h4>
            <button class="btn btn-light btn-sm" id="nextMonth">❯</button>
        </div>

        <div class="card-body">
            <table class="table table-bordered text-center">
                <thead class="table-light">
                    <tr>
                        <th>Dom</th>
                        <th>Lun</th>
                        <th>Mar</th>
                        <th>Mié</th>
                        <th>Jue</th>
                        <th>Vie</th>
                        <th>Sáb</th>
                    </tr>
                </thead>
                <tbody id="calendarBody"></tbody>
            </table>
        </div>
    </div>
</div>
</body>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
const monthYear = document.getElementById("monthYear");
const calendarBody = document.getElementById("calendarBody");

let currentDate = new Date();
let citas = []; // guarda las citas desde MySQL

const colores = { 
    "Consulta general": "#ebeb26",          // amarillo
    "Consulta psicologica": "#9C27B0",      // morado
    "Consulta nutricional": "#eb6826",      // naranja
    "Consulta odontologica": "#db5a89",     // rosa
    "Fisioterapia": "#368be0",              // verde
    "Laboratorio Clinico": "#04b315"        // verde brillante
};


async function cargarCitas() {
    try {
        const res = await fetch("http://localhost:3000/api/citas");
        citas = await res.json();
        renderCalendar();
    } catch (error) {
        console.error("Error al cargar citas:", error);
    }
}

function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    monthYear.textContent = currentDate.toLocaleString("es-MX", {
        month: "long",
        year: "numeric"
    }).toUpperCase();

    const firstDay = new Date(year, month, 1).getDay();
    const lastDay = new Date(year, month + 1, 0).getDate();

    calendarBody.innerHTML = "";
    let row = document.createElement("tr");

    for (let i = 0; i < firstDay; i++) row.appendChild(document.createElement("td"));

    for (let day = 1; day <= lastDay; day++) {
        const cell = document.createElement("td");
        cell.style.verticalAlign = "top";
        cell.innerHTML = `<strong>${day}</strong>`;

        const fechaStr = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

        const citasDia = citas.filter(c => c.fecha.startsWith(fechaStr));

        citasDia.forEach(cita => {
            const badge = document.createElement("div");
            badge.textContent = cita.servicio;
            badge.style.background = colores[cita.servicio] || colores["Otro"];
            badge.style.color = "black";
            badge.style.padding = "2px 4px";
            badge.style.marginTop = "2px";
            badge.style.fontSize = "12px";
            badge.style.borderRadius = "4px";

            cell.appendChild(badge);
        });

        cell.style.cursor = "pointer";
        cell.onclick = () => {
            alert("Día seleccionado: " + fechaStr);
        };

        row.appendChild(cell);

        if ((day + firstDay) % 7 === 0) {
            calendarBody.appendChild(row);
            row = document.createElement("tr");
        }
    }

    calendarBody.appendChild(row);
}

document.getElementById("prevMonth").onclick = () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
};

document.getElementById("nextMonth").onclick = () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
};

cargarCitas();
</script>

</html>
