<head>

    <link href="https://cdn.lineicons.com/5.0/lineicons.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet">
    <title>Acceso doctores</title>
</head>
<header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html" style="font-size: 24px;align-items: center;display: flex;" title="Volver a la pagina principal">
                    <i class="lni lni-zapier"></i>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav"> 
                        <li>
                            <a class="nav-link active" href="index.html">Cerrar sesion</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
<body>
    <h1 style="text-align: center;">Citas agendadas</h1>
    <div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <button class="btn btn-light btn-sm" id="prevMonth">❮</button>
            <h4 class="mb-0" id="monthYear"></h4>
            <button class="btn btn-light btn-sm" id="nextMonth">❯</button>
        </div>

        <div class="card-body">
            <table class="table table-bordered text-center">
                <thead class="table-light">
                    <tr>
                        <th>Dom</th>
                        <th>Lun</th>
                        <th>Mar</th>
                        <th>Mié</th>
                        <th>Jue</th>
                        <th>Vie</th>
                        <th>Sáb</th>
                    </tr>
                </thead>
                <tbody id="calendarBody"></tbody>
            </table>
        </div>
    </div>
</div>
</body>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
    const monthYear = document.getElementById("monthYear");
    const calendarBody = document.getElementById("calendarBody");

    let currentDate = new Date();

    function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        monthYear.textContent = currentDate.toLocaleString("es-MX", {
            month: "long",
            year: "numeric"
        }).toUpperCase();

        const firstDay = new Date(year, month, 1).getDay();
        const lastDay = new Date(year, month + 1, 0).getDate();

        calendarBody.innerHTML = "";
        let row = document.createElement("tr");

        for (let i = 0; i < firstDay; i++) row.appendChild(document.createElement("td"));

        for (let day = 1; day <= lastDay; day++) {
            const cell = document.createElement("td");
            cell.textContent = day;

            cell.style.cursor = "pointer";

            cell.onclick = () => {
                alert("Cita seleccionada para el día: " + day);
            };

            row.appendChild(cell);

            if ((day + firstDay) % 7 === 0) {
                calendarBody.appendChild(row);
                row = document.createElement("tr");
            }
        }

        calendarBody.appendChild(row);
    }

    document.getElementById("prevMonth").onclick = () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar();
    };

    document.getElementById("nextMonth").onclick = () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar();
    };

    renderCalendar();
</script>
</html>
